name: Build & Release BGM Coin Pro

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Yeni surum numarasi (ornek: 1.0.6)"
        required: true
        default: "1.0.6"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build surumunu goster
        shell: powershell
        run: |
          Write-Host "BGM Coin Pro build version: ${{ inputs.version }}"
          Write-Host "Kaynak dosyalara dokunulmuyor - UTF8 korunuyor."

      - name: Python paketlerini kur
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview requests

      - name: BGM Coin Pro EXE olustur
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm BGM_Coin_Pro.spec

      - name: BGM Updater EXE olustur
        shell: powershell
        run: |
          pyinstaller --clean --noconfirm BGM_Updater.spec

      - name: Inno Setup ile Setup EXE olustur
        shell: powershell
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }

          if (-not (Test-Path $iscc)) {
            throw "Inno Setup bulunamadi."
          }

          & $iscc "BGM_Coin_Pro_Installer.iss"

      - name: Installer dosyasini bul
        id: installer
        shell: powershell
        run: |
          $version = "${{ inputs.version }}"

          $file = Get-ChildItem -Path . -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -like "BGM_Coin_Pro_Setup*" } |
            Select-Object -First 1

          if (-not $file) {
            throw "BGM Coin Pro Setup EXE bulunamadi."
          }

          $newName = "BGM_Coin_Pro_Setup_$version.exe"
          $newPath = Join-Path $file.DirectoryName $newName

          Copy-Item $file.FullName $newPath -Force

          $hash = (Get-FileHash $newPath -Algorithm SHA256).Hash.ToLower()

          "path=$newPath" >> $env:GITHUB_OUTPUT
          "name=$newName" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

          Write-Host "Installer: $newName"
          Write-Host "SHA256: $hash"

      - name: Setup artifact yukle
        uses: actions/upload-artifact@v4
        with:
          name: BGM-Coin-Pro-Windows-Setup-${{ inputs.version }}
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error

      - name: GitHub Release olustur
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}"
          $tag = "v$version"
          $installer = "${{ steps.installer.outputs.path }}"

          gh release create $tag $installer `
            --title "BGM Coin Pro V$version" `
            --notes "BGM Coin Pro Desktop V$version"

      - name: Update manifest olustur
        shell: powershell
        run: |
          $version = "${{ inputs.version }}"
          $fileName = "${{ steps.installer.outputs.name }}"
          $sha = "${{ steps.installer.outputs.sha256 }}"
          $repo = "${{ github.repository }}"

          $downloadUrl = "https://github.com/$repo/releases/download/v$version/$fileName"

          $manifest = [ordered]@{
            version = $version
            download_url = $downloadUrl
            sha256 = $sha
            notes = "BGM Coin Pro Desktop V$version"
          }

          $manifest |
            ConvertTo-Json |
            Set-Content "update_manifest.json" -Encoding UTF8

      - name: Manifest GitHub'a kaydet
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add update_manifest.json

          if (-not (git diff --cached --quiet)) {
            git commit -m "Update manifest to V${{ inputs.version }}"
            git pull --rebase
            git push
          }
